version: 2

# RAW layer: structure owned by DCM (dcm_project/.../raw/), data by ingestion.
sources:
  - name: raw
    database: "{{ var('environments')[target.name]['raw_compute_db'] }}"
    schema: "RAW{{ var('environments')[target.name]['schema_suffix'] }}"
    tables:
      - name: v_customer_src_latest
        identifier: V_CUSTOMER_SRC_LATEST
        description: latest delivered record per customer
        columns:
          - name: CUSTOMER_ID
            data_tests: [not_null, unique]
