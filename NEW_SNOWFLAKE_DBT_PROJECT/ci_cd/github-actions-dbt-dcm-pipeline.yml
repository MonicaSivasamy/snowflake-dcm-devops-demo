# =============================================================================
# CI/CD template - GitHub Actions + Snowflake CLI (snow dcm + snow dbt)
# Copy to .github/workflows/dbt-dcm-pipeline.yml to activate.
# Secrets: SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PASSWORD (PAT).
# GitHub environments "QA" and "PROD" with required reviewers = approval gates.
#
#   pull request -> main : DCM plan (DEV) + dbt compile check
#   merge to main        : DCM deploy DEV, dbt deploy + build DEV
#   tag dbt-dcm-v*       : same for QA, then (after approval) PROD
# Order is always: DCM (containers + security) BEFORE dbt (transformations).
# =============================================================================
name: snowflake-dbt-dcm

on:
  pull_request:
    branches: [main]
    paths: ["NEW_SNOWFLAKE_DBT_PROJECT/dcm_project/**", "NEW_SNOWFLAKE_DBT_PROJECT/dbt_project/**"]
  push:
    branches: [main]
    paths: ["NEW_SNOWFLAKE_DBT_PROJECT/dcm_project/**", "NEW_SNOWFLAKE_DBT_PROJECT/dbt_project/**"]
    tags: ["dbt-dcm-v*"]

env:
  DCM_DIR: NEW_SNOWFLAKE_DBT_PROJECT/dcm_project
  DBT_DIR: NEW_SNOWFLAKE_DBT_PROJECT/dbt_project
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: DCM_DEMO_ADMIN
  SNOWFLAKE_WAREHOUSE: DCM_DEMO_WH

jobs:
  check-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install snowflake-cli
      - run: snow dcm plan --target DEV --from "$DCM_DIR" -x
      - run: snow dbt deploy ENT_DBT_CTRL_DB.PROJECTS.DBT_CI_CHECK --source "$DBT_DIR" -x
      - run: snow dbt execute -x ENT_DBT_CTRL_DB.PROJECTS.DBT_CI_CHECK compile --target dev

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: ${{ startsWith(github.ref, 'refs/tags/') && fromJSON('["QA","PROD"]') || fromJSON('["DEV"]') }}
    environment: ${{ matrix.env }}          # QA / PROD wait for required reviewers
    steps:
      - uses: actions/checkout@v4
      - run: pip install snowflake-cli
      - name: DCM plan + deploy (containers, security)
        run: |
          snow dcm plan   --target ${{ matrix.env }} --from "$DCM_DIR" -x
          snow dcm deploy --target ${{ matrix.env }} --from "$DCM_DIR" -x --alias "${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
      - name: dbt deploy + build (transformations, tests, policy attachments)
        run: |
          T=$(echo "${{ matrix.env }}" | tr A-Z a-z)
          snow dbt deploy ENT_DBT_CTRL_DB.PROJECTS.DBT_${{ matrix.env }} --source "$DBT_DIR" -x
          snow dbt execute -x ENT_DBT_CTRL_DB.PROJECTS.DBT_${{ matrix.env }} build --target "$T"
